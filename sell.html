<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='styles.css'><title>Sell It All</title></head><body><nav class="nav"><a href="index.html" class="brand"><b>✦</b> Sell It All</a><div class="links"><a href="marketplace.html">Marketplace</a><a href="seller-dashboard.html">My listings</a><a href="account.html">Account</a></div></nav><main class='wrap'><a class='back' href='index.html'>← Back home</a><div class='head'><p class='eyebrow'>List an item</p><h2>Tell us about what you're selling.</h2><p class='sub'>Your listing is private until an administrator approves it.</p></div><form id='listingForm' class='form'><div class='grid'><label>Item title<input required name='title'></label><label>Price (₦)<input required type='number' name='price'></label><label>Category<select name='category'><option>Furniture</option><option>Electronics</option><option>Fashion</option><option>Home & kitchen</option><option>Books</option><option>Other</option></select></label><label>Condition<select name='condition'><option>Like new</option><option>Good</option><option>Fair</option></select></label></div><label>Item photo<input required type='file' name='photo' accept='image/*'><small>Upload a clear photo of the item.</small></label><label>Description<textarea required name='description' rows='4'></textarea></label><div class='grid contacts'><label>Your name<input required name='seller'></label><label>Phone / WhatsApp<input required name='phone'></label><label>Location<input required name='location'></label></div><button class='button'>Send for verification →</button></form></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='app.js'></script><footer><a href='terms.html'>Terms</a> · <a href='privacy.html'>Privacy</a> · <a href='safety.html'>Safety</a></footer></body></html>
